name: publish
on:
  release:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: wlgdev/deploy/.github/actions/deploy@main
        with:
          pat: ${{ secrets.DEPLOY_TRIGGER_PAT }}
          target: "share:seafile:80"
          is_dev: "false"
          # Keep these coordinates aligned with docker-compose.yml.
          service_image_name: seafileltd/seafile-mc
          service_image_tag: "14.0-latest"
          env: |
            DEFAULT_DOMAIN=${{ vars.DEFAULT_DOMAIN }}
            JWT_PRIVATE_KEY=${{ secrets.JWT_PRIVATE_KEY }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_USER_PASSWORD=${{ secrets.DB_USER_PASSWORD }}
            SEAFILE_ADMIN_EMAIL=${{ vars.SEAFILE_ADMIN_EMAIL }}
            SEAFILE_ADMIN_PASSWORD=${{ vars.SEAFILE_ADMIN_PASSWORD }}